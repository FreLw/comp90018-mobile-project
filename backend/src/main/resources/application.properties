spring.application.name=backend
server.port=8080

# Exposes the standard Spring Boot health endpoint at /actuator/health.
management.endpoints.web.exposure.include=health,info

# Values can be overridden with DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, and
# DB_PASSWORD environment variables. Never commit a real password in this file.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:comp90018}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:comp90018_app}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema. Hibernate only verifies that the Kotlin entities
# agree with the migration files; it never changes the production schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
